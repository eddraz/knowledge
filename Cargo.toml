[package]
name = "knowledge-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local RAG knowledge base CLI: SQLite + sqlite-vec + FTS5, bge-m3 embeddings, grounded LLM answers"
repository = "https://github.com/eddraz/knowledge"
readme = "README.md"
default-run = "knowledge"
exclude = ["odd", ".github", "examples"]

[lib]
name = "knowledge"
path = "src/lib.rs"

[[bin]]
name = "knowledge"
path = "src/main.rs"

[[bin]]
name = "native-ask"
path = "src/bin/native-ask.rs"
required-features = ["native"]

[features]
native = ["dep:candle", "dep:candle-transformers", "dep:tokenizers", "dep:candle-nn"]

[dependencies]
anyhow = "1"
bytemuck = "1"
candle = { package = "candle-core", version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1"
thiserror = "2"
tokenizers = { version = "0.21", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
unicode-segmentation = "1"

[profile.release]
lto = "thin"
strip = true
