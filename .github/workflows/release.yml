name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, native generation)
        run: cargo build --release --features native --target ${{ matrix.target }}

      - name: Stage assets
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/knowledge" "dist/knowledge-${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/native-ask" "dist/native-ask-${{ matrix.suffix }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
