name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binaries (native generation)
        run: cargo build --release --features native --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="knowledge-${version}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/knowledge" "$dir/"
          cp "target/${{ matrix.target }}/release/native-ask" "$dir/"
          cp README.md "$dir/"
          [ -f LICENSE ] && cp LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
